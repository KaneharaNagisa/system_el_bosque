services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: system_el_bosque
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - app_node_modules:/var/www/html/node_modules
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_el_bosque
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: db_el_bosque
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_el_bosque
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: user
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - app-network
    ports:
      - "3306:3306"

  # --- phpMyAdmin (DB GUI) ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
      TZ: Asia/Tokyo
    ports:
      - "8081:80" # ブラウザから http://localhost:8081 でアクセス
    networks:
      - app-network

  # --- Mailpit (Mail Server) ---
  mailpit:
    image: axllent/mailpit
    container_name: mailpit_el_bosque
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTPポート (Laravelから接続)
      - "8025:8025" # Web UIポート (ブラウザで確認)
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
  app_node_modules:
